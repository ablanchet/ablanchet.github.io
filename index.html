<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connecteur Google personnel</title>
  <style>
    :root { --bg:#f7f8fa; --text:#1d2433; --muted:#5b6475; --accent:#2f5d8a; }
    @media (prefers-color-scheme: dark) { :root { --bg:#14181f; --text:#e4e8ef; --muted:#9aa3b2; --accent:#8ab4e0; } }
    body { margin:0; background:var(--bg); color:var(--text);
           font:17px/1.6 Georgia, "Times New Roman", serif; }
    main { max-width:38rem; margin:0 auto; padding:4rem 1.5rem; }
    h1 { font-size:1.9rem; line-height:1.25; margin:0 0 1.2rem; }
    p { margin:0 0 1rem; }
    .muted { color:var(--muted); font-size:.95rem; }
    a { color:var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Hi ! 👋</h1>
  </main>
</body>
</html>
